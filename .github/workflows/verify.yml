name: Verify LocalizeOS
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install contract tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python dependency resolution
        run: python -m pip check
      - name: Compile Python
        run: python -m compileall -q contracts scripts tests
      - name: GenVM lint and validation
        env:
          GENVM_VERSION: v0.2.17
        run: genvm-lint check contracts/localizeos.py
      - name: Behavioral preflight
        run: python scripts/preflight.py
      - name: Pure validation tests
        run: python -m pytest tests/direct -q
      - name: Direct Mode contract tests
        env:
          GENVM_VERSION: v0.2.17
        run: gltest tests/test_localizeos.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Tests
        working-directory: apps/web
        run: npm test
      - name: Production build
        working-directory: apps/web
        run: npm run build
      - name: Audit
        working-directory: apps/web
        run: npm audit
